[pytest]
# Collect the whole merged repository:
#   test_atlas.py            legacy data/ingestion-domain suite (pre-merge baseline)
#   tests/test_controls.py   v0.2 control-layer regression suite (preserved intact)
#   tests/test_pilot2_replay.py
#   tests/test_integration_facade.py  single-authorized-path integration tests
#   tests/test_gate_b_live_binding.py Gate B live-data binding proofs (B1-B5)
testpaths = . tests
python_files = test_*.py
norecursedirs = .git .venv live_validation_results docs control_layer_provenance
markers =
    live: reaches a real upstream provider; skipped when its credential is absent.
          A skip is a BLOCKED Gate B result, never a PASS.
